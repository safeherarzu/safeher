name: safeher
description: SafeHer App
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

  # Maps
  google_maps_flutter: ^2.6.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2

  # SOS features
  vibration: ^3.1.8
  url_launcher: ^6.2.6

  # Onboarding
  shared_preferences: ^2.2.2
  smooth_page_indicator: ^2.0.1

  # Utils
  intl: ^0.20.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/onboarding/onboarding1.png
    - assets/onboarding/onboarding2.png
    - assets/onboarding/onboarding3.png